<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>AIBeautyKit — Payment Cancelled</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23c4613a'/><text x='16' y='22' text-anchor='middle' font-family='Georgia,serif' font-size='19' font-weight='bold' fill='white'>A</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#f5f0e8;--dark:#1a120a;--dark2:#2d1a0e;
  --terra:#c4613a;--terra-d:#9e4a29;--muted:#8b6e5a;--border:rgba(26,18,10,.12);
}
body{background:var(--cream);color:var(--dark);font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
nav{background:var(--dark2);padding:16px 24px;display:flex;align-items:center}
nav a{font-family:'Lora',serif;font-weight:700;font-size:1.1rem;color:#f5f0e8;text-decoration:none}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px}
.card{background:#fff;border:1.5px solid var(--border);border-radius:20px;padding:56px 48px;max-width:480px;width:100%;text-align:center;box-shadow:0 8px 40px rgba(26,18,10,.08)}
.icon{font-size:3.5rem;margin-bottom:24px}
h1{font-family:'Lora',serif;font-size:1.9rem;font-weight:700;color:var(--dark);margin-bottom:16px}
p{color:var(--muted);font-size:.95rem;line-height:1.75;margin-bottom:16px}
.actions{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.btn{display:block;padding:14px 24px;border-radius:10px;font-weight:600;font-size:.95rem;text-decoration:none;text-align:center;transition:background .2s,transform .15s}
.btn-primary{background:var(--terra);color:#fff}
.btn-primary:hover{background:var(--terra-d);transform:translateY(-1px)}
.btn-ghost{color:var(--muted);font-size:.88rem;padding:8px}
.btn-ghost:hover{color:var(--terra)}
footer{text-align:center;padding:24px;color:var(--muted);font-size:.8rem;border-top:1px solid var(--border)}
</style>
</head>
<body>
<nav><a href="/">AIBeautyKit</a></nav>
<div class="main">
  <div class="card">
    <div class="icon">↩️</div>
    <h1>Payment Cancelled</h1>
    <p>No worries — your payment was not charged. You can go back and choose a plan whenever you're ready.</p>
    <p>If you have questions about what's included, check our <a href="/faq" style="color:var(--terra)">FAQ</a> or reach out via Telegram.</p>
    <div class="actions">
      <a href="/pricing" class="btn btn-primary">View Plans Again</a>
      <a href="/" class="btn btn-ghost">Back to Home</a>
    </div>
  </div>
</div>
<footer>&copy; 2026 AIBeautyKit</footer>
</body>
</html>
