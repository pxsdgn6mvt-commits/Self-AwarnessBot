<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="api-base" content="http://localhost:8081"/>
  <title>Запись — услуга и время</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <h1 id="cat-title">Услуги</h1>

  <div class="section">
    <h2>Услуга</h2>
    <div id="service-list" class="pill-grid">
      <p style="color:var(--tg-hint)">Загрузка…</p>
    </div>
  </div>

  <div class="section">
    <h2>Дата</h2>
    <input type="date" id="date-input" onchange="updateSlots()"/>
  </div>

  <div class="section">
    <h2>Время</h2>
    <div id="slot-grid" class="pill-grid">
      <p style="color:var(--tg-hint)">Выберите дату</p>
    </div>
  </div>

  <button class="btn" onclick="gotoConfirm()">Далее →</button>

  <script src="app.js"></script>
  <script>
    // Set min date to today
    const di = document.getElementById('date-input');
    di.min = new Date().toISOString().slice(0,10);
    di.value = di.min;
    loadServices();
  </script>
</body>
</html>
